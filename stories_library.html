// Color palettes for card banners
const COLORS = {
  Hindu: 'linear-gradient(135deg, #FF6B1A, #FFD700)',
  Ramayana: 'linear-gradient(135deg, #1565C0, #42A5F5)',
  Mahabharata: 'linear-gradient(135deg, #4A148C, #AB47BC)',
  Jain: 'linear-gradient(135deg, #1B5E20, #66BB6A)',
  Sikh: 'linear-gradient(135deg, #E65100, #FFCA28)',
  Islamic: 'linear-gradient(135deg, #006064, #26C6DA)'
};

let activeAge = 'all';
let activeTrad = 'all';

function render() {
  const grid = document.getElementById('grid');
  const filtered = STORIES.filter(s =>
    (activeAge === 'all' || s.age === activeAge) &&
    (activeTrad === 'all' || s.tradition === activeTrad)
  );
  document.getElementById('storyCount').textContent =
    `Showing ${filtered.length} of ${STORIES.length} stories`;
  if (!filtered.length) {
    grid.innerHTML = '<div class="no-stories">No stories match your filters. Try selecting "All"! 🌟</div>';
    return;
  }
  grid.innerHTML = filtered.map(s => `
    <div class="card" onclick="openModal(${s.id})">
      <div class="card-banner" style="background:${COLORS[s.tradition]}">
        ${s.emoji}
        <span class="card-age-badge">Ages ${s.age}</span>
        <span class="card-trad-badge">${s.tradition}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${s.title}</div>
        <div class="card-preview">${s.preview}</div>
        <div class="card-footer">
          <span class="card-moral">${s.moral.substring(0,50)}…</span>
          <button class="read-btn">Read ▶</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const s = STORIES.find(x => x.id === id);
  document.getElementById('modalBanner').style.background = COLORS[s.tradition];
  document.getElementById('modalBanner').textContent = s.emoji;
  document.getElementById('modalMeta').innerHTML = `
    <span class="badge badge-age">Ages ${s.age}</span>
    <span class="badge badge-trad">${s.tradition}</span>
  `;
  document.getElementById('modalTitle').textContent = s.title;
  document.getElementById('modalStory').textContent = s.story;
  document.getElementById('modalThink').textContent = s.think;
  document.getElementById('modalMoral').textContent = s.moral;
  document.getElementById('waCopyBtn').onclick = () => copyForWhatsApp(s);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function copyForWhatsApp(s) {
  const ageLabel = { '2-4': 'Tiny Tales (Ages 2-4)', '5-7': 'Adventure Tales (Ages 5-7)', '8-10': 'Wisdom Tales (Ages 8-10)' }[s.age];
  const text = `🌟 *Little Lights — ${ageLabel}*\n` +
    `📖 *${s.title}*\n` +
    `🏷️ ${s.tradition}\n\n` +
    s.story + '\n\n' +
    `🤔 *Think About It!*\n${s.think}\n\n` +
    `✨ *Today's Lesson:* ${s.moral}`;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('waCopyBtn').textContent = '✅ Copied! Open WhatsApp and paste.';
    setTimeout(() => {
      document.getElementById('waCopyBtn').textContent = '📋 Copy for WhatsApp';
    }, 3000);
  });
}

// Filter buttons
document.querySelectorAll('.age-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeAge = btn.dataset.age;
    document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});
document.querySelectorAll('.trad-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTrad = btn.dataset.trad;
    document.querySelectorAll('.trad-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

render();
</script>
</body>

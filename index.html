 thank you to today?", "moral": "✨ *Today's Lesson:* Small words of gratitude can quietly change how an entire community feels."}, {"id": 59, "category": "Drama", "title": "The Day Mama Forgot My Name", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "😟 Little Tia tugged Mama's sleeve at the busy market. \"Mama! Mama!\" But Mama, juggling bags and a phone call, said, \"Not now, sweetie,\" without even looking down.\n\nTia's lip wobbled. \"Did Mama forget me?\" she worried, feeling very small in the crowd.\n\nWhen they got home, Mama finally knelt down, put everything away, and looked right into Tia's eyes. \"I'm sorry I was busy, my love. Tell me everything now.\" 💕\n\nTia told her all about the butterfly she'd seen, talking and talking. Mama listened to every word.\n\n\"You didn't forget me,\" Tia realized happily. \"You were just busy for a little while.\" 🦋", "think": "🤔 *Think About It!*\nHave you ever felt like someone forgot about you when they were just busy for a moment? How did it feel when they came back to listen?", "moral": "✨ *Today's Lesson:* Being busy for a moment doesn't mean someone stopped caring — love comes back around."}, {"id": 60, "category": "Drama", "title": "New Shoes, New Steps", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "👟 It was little Arjun's very first day of preschool, and his new shoes felt stiff and strange. \"I don't want to go,\" he whispered, holding tight to Papa's hand at the gate.\n\nInside, so many new faces, new sounds, new everything. Arjun's tummy felt fluttery. 😰\n\nA girl named Ria sat beside him with a box of crayons. \"Want to draw with me?\" she asked with a big smile.\n\nSlowly, Arjun picked up a red crayon. They drew together, quiet at first, then giggling by snack time.\n\nWhen Papa came to pick him up, Arjun ran to him excitedly. \"I made a friend! Can I wear my new shoes again tomorrow?\" 😊👟", "think": "🤔 *Think About It!*\nHave you ever felt nervous about something new, like a first day somewhere? What helped you feel better?", "moral": "✨ *Today's Lesson:* New things feel scary at first, but they often become wonderful once we give them a chance."}, {"id": 61, "category": "Drama", "title": "The Blanket That Went to the Wash", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "🧸 Little Sam had one soft, fuzzy blanket named Cloudy that he carried absolutely everywhere. One day, Mama said, \"Cloudy is due for a wash — he's getting a little smelly!\"\n\nSam's eyes went wide with worry. \"But what if he doesn't come back the same?!\" he cried.\n\nMama gently placed Cloudy in the machine. Sam watched through the little window, sniffling, as Cloudy spun round and round. 🌀\n\nWhen the machine finally stopped, Mama pulled out Cloudy — warm, fluffy, and smelling like sunshine. 🌞\n\nSam hugged him tight. \"You're even softer now!\" he laughed with relief.\n\n\"Some changes,\" Mama smiled, \"make things even better than before.\" 💙", "think": "🤔 *Think About It!*\nHave you ever worried about a change, like washing your favorite toy or trying new food, and then found out it was actually fine?", "moral": "✨ *Today's Lesson:* Some changes feel scary beforehand but turn out just fine, or even better, afterward."}, {"id": 62, "category": "Drama", "title": "My Brother Got All the Cake", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "🎂 At the birthday party, little Naina watched her big brother get the piece of cake with the biggest pink flower on top. \"That's not fair! I wanted that piece!\" she pouted.\n\nShe crossed her arms and refused to eat her own piece, even though it had chocolate sprinkles she usually loved.\n\nHer brother noticed her sad face. He looked at his flower piece, then at her. \"Here,\" he said, breaking off half the flower with his spoon and putting it on her plate. \"Sharing makes cake taste better anyway.\" 🍰\n\nNaina's frown turned into a big smile. \"Thank you!\" She took a huge, happy bite. 😋", "think": "🤔 *Think About It!*\nHave you ever felt upset about something small not being fair? What happened when someone decided to share?", "moral": "✨ *Today's Lesson:* Sharing turns a small disappointment into a moment of kindness for everyone."}, {"id": 63, "category": "Drama", "title": "Grandpa's Chair Is Empty Today", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "🪑 Little Ana noticed Grandpa's favorite chair by the window was empty. \"Where's Grandpa?\" she asked Mama.\n\n\"Grandpa is resting at the hospital for a little while, so the doctors can help him feel strong again,\" Mama said softly.\n\nAna felt a funny lump in her throat. She sat in Grandpa's chair and hugged his old, worn cushion. 💺\n\n\"Can I draw him a picture?\" she asked.\n\nShe drew the sun, their garden, and Grandpa's favorite dog, and Mama helped mail it that very day.\n\nA week later, Grandpa came home, tired but smiling, and taped Ana's drawing right beside his chair. \"This made me feel better every single day,\" he said, hugging her tight. 💛", "think": "🤔 *Think About It!*\nHas someone you love ever been away or unwell? What is something small you could do to show them you're thinking of them?", "moral": "✨ *Today's Lesson:* Small gestures of love can reach someone even when we can't be right beside them."}, {"id": 64, "category": "Drama", "title": "The Puzzle Piece That Didn't Fit", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "🧩 During playtime, little Ravi tried to jam a puzzle piece into the wrong spot, pushing and pushing. \"Go in!\" he grumbled, frustrated.\n\nHis friend Meera watched. \"Maybe it belongs somewhere else,\" she said gently.\n\nRavi huffed but tried the piece in a different spot — and click! It fit perfectly, completing the picture of a smiling sun. ☀️\n\n\"It just needed the right place,\" Ravi said, surprised.\n\nMeera smiled. \"Sometimes things — and people — just need to find where they truly belong.\" 🧩💛", "think": "🤔 *Think About It!*\nHave you ever tried to force something to work when it just needed a different approach? What happened when you tried something new?", "moral": "✨ *Today's Lesson:* If something doesn't fit right away, it might just belong somewhere else — that's okay."}, {"id": 65, "category": "Drama", "title": "Why Is Papa Sad Today?", "age": "Ages 2–4 🧸", "tradition": "Drama 🎭", "text": "😔 Little Kabir noticed Papa sitting very quietly on the sofa, not smiling like usual. \"Papa, why are you sad?\" he asked, climbing onto his lap.\n\n\"I had a hard day at work, beta,\" Papa said softly. \"Grown-ups feel sad sometimes too.\"\n\nKabir thought hard, then ran to get his favorite toy elephant. \"Here, Papa. Elephant makes ME feel better.\" He placed it gently in Papa's hands. 🐘\n\nPapa smiled, really smiled, for the first time all day, and pulled Kabir into a warm hug. \"Thank you, beta. You made my day better already.\" 🤗", "think": "🤔 *Think About It!*\nHave you ever noticed someone you love feeling sad? What is a small, kind thing you could do to help them feel better?", "moral": "✨ *Today's Lesson:* Grown-ups have feelings too, and a small act of kindness can help anyone, big or small."}, {"id": 66, "category": "Drama", "title": "The New Kid With the Funny Lunch", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "🍱 A new boy named Hiro joined class, and at lunchtime, some kids pointed and giggled at his food. \"Ew, what IS that? It smells weird!\" one boy said loudly.\n\nHiro's face turned red, and he quietly closed his lunchbox, not eating another bite.\n\nLittle Meera noticed and walked over. \"What is it? It actually smells really good,\" she said honestly, sitting beside him.\n\n\"It's onigiri — rice balls my grandma makes,\" Hiro said quietly. \"Want to try one?\"\n\nMeera took a bite. \"This is amazing! Can I bring you something from MY lunch tomorrow?\"\n\nThe next day, they traded snacks and swapped stories about their families, and Hiro didn't feel like the \"weird new kid\" anymore — he felt like Meera's friend. 🍙💕", "think": "🤔 *Think About It!*\nHave you ever laughed at something just because it seemed different or unfamiliar? How do you think it felt for the other person?", "moral": "✨ *Today's Lesson:* Curiosity and kindness turn 'different' into 'interesting' — and can turn a stranger into a friend."}, {"id": 67, "category": "Drama", "title": "Losing by One Point", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "🏀 In the final seconds of the school basketball game, little Dev missed the last shot. His team lost by just one point. 😞\n\nHe sat alone on the bench, staring at the floor, feeling like he'd let everyone down.\n\nHis coach sat beside him. \"You know what I saw out there? A boy who took the brave shot, even though it was scary, instead of passing it away out of fear.\"\n\n\"But we still lost,\" Dev mumbled.\n\n\"Yes,\" said Coach, \"but you'll take that shot again next time, and the next, until one day it goes in. That takes courage, not talent.\"\n\nDev looked up, still sad, but a little less heavy. \"I'll practice all week,\" he said quietly. 🏀💪", "think": "🤔 *Think About It!*\nHave you ever lost at something you really wanted to win? What helped you feel okay about trying again?", "moral": "✨ *Today's Lesson:* Losing doesn't erase the courage it took to try — and trying again is how we get better."}, {"id": 68, "category": "Drama", "title": "The Secret I Didn't Tell", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "🤫 Little Simran accidentally broke her mother's favorite vase while playing indoors, but quickly hid the pieces and said nothing. 💔\n\nFor days, a heavy feeling sat in her tummy every time she saw the empty shelf where the vase used to sit.\n\nOne evening, she couldn't hold it in anymore. \"Mama, I broke your vase. I was scared to tell you.\" Tears filled her eyes.\n\nMama hugged her tightly. \"Thank you for telling me the truth, even though it was hard. That matters much more to me than any vase.\" 🏺💕\n\nSimran felt the heavy feeling in her tummy melt away completely, replaced by something light and warm. \"I feel so much better now,\" she whispered.", "think": "🤔 *Think About It!*\nHave you ever kept a secret that made your tummy feel heavy? What happened when you finally told the truth?", "moral": "✨ *Today's Lesson:* Telling the truth feels scary at first, but it lifts a weight off your heart."}, {"id": 69, "category": "Drama", "title": "Moving Day", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "📦 Boxes filled every room as little Farah watched her whole house get packed up. \"I don't want to move to a new city,\" she said, hugging her stuffed rabbit tightly. \"What if nobody likes me there?\"\n\nPapa sat beside the last box. \"I felt scared too, when I moved here as a boy. But you know what helped? I brought pieces of my old home with me — photos, favorite books, even this same old rabbit toy of mine that I gave to you.\" 🐰\n\nFarah looked down at her rabbit, surprised. \"This was YOURS?\"\n\n\"Yes, and it made new places feel a little like home. You'll make new friends, but you don't have to leave everything behind to do it.\" 💛\n\nFarah packed the rabbit carefully into her own special bag.", "think": "🤔 *Think About It!*\nHave you ever had to leave somewhere familiar for somewhere new? What helped that new place start to feel like home?", "moral": "✨ *Today's Lesson:* We can carry pieces of what we love with us into new beginnings, so nothing is ever fully left behind."}, {"id": 70, "category": "Drama", "title": "The Friend Who Moved Away", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "✈️ Little Aditi's best friend Wren was moving to a faraway city. On the last day of school together, they sat quietly at recess, not knowing what to say. 😢\n\n\"Will we still be best friends?\" Aditi asked, her voice shaking.\n\n\"We can write letters,\" Wren said. \"And Mom said we can video call sometimes.\"\n\nThey made a promise: every full moon, no matter how far apart, they'd both look up at the same moon at the same time and think of each other. 🌕\n\nMonths later, on a lonely night, Aditi looked up and saw the full moon glowing bright. She smiled, knowing Wren was probably looking at the exact same moon, right then, thinking of her too.", "think": "🤔 *Think About It!*\nHave you ever had a friend move away? What is a way you could still feel close to them, even from far apart?", "moral": "✨ *Today's Lesson:* Distance changes how often we see someone, but it doesn't have to change how much we care."}, {"id": 71, "category": "Drama", "title": "Two Left Shoes on Picture Day", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "📸 On school picture day, little Omar rushed out the door and didn't notice until he sat down in class — he was wearing two different left shoes! 😱\n\n\"Everyone's going to laugh at me,\" he panicked, hiding his feet under the desk all morning.\n\nWhen picture time came, a classmate named Zoe noticed and whispered, \"Everyone has something a little weird about them today. Look — my hair ribbon is crooked, and Sam has a marker stain on his shirt.\"\n\nOmar looked around and realized she was right — nobody was perfectly put together.\n\nHe walked up for his photo, smiled a real, big smile, and didn't hide his feet at all.\n\nWhen the pictures came back, his smile was the best part of the photo — nobody even noticed the shoes. 😄", "think": "🤔 *Think About It!*\nHave you ever worried everyone would notice a small mistake you made? Did anyone actually notice as much as you thought?", "moral": "✨ *Today's Lesson:* Small mistakes feel huge to us, but they rarely matter as much to everyone else."}, {"id": 72, "category": "Drama", "title": "The Fight Over the Last Swing", "age": "Ages 5–7 🚀", "tradition": "Drama 🎭", "text": "🛝 At recess, little Yusuf and his friend Priya both ran for the last empty swing at the exact same time. \"I got here first!\" Yusuf shouted. \"No, I did!\" Priya argued back.\n\nThey both grabbed the swing, tugging, until the teacher walked over. \"Instead of pulling it apart, why don't you figure out how to share it?\"\n\nYusuf and Priya looked at each other, annoyed at first. Then Priya said, \"Ten swings each, then we switch?\"\n\nYusuf nodded slowly. \"Okay. You go first.\"\n\nBy the time recess ended, they'd taken turns four times, laughing and counting swings together, forgetting they'd ever been arguing at all. 😄", "think": "🤔 *Think About It!*\nHave you ever argued with a friend over something small? What helped you find a way to share instead of fight?", "moral": "✨ *Today's Lesson:* Most fights over 'who's right' can be solved by finding a way to share instead."}, {"id": 73, "category": "Drama", "title": "The Report Card I Hid Under My Bed", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "📋 Ishaan stared at his report card — lower marks than he'd ever gotten before. Scared of disappointing his parents, he shoved it under his mattress and said nothing for three whole days. 😰\n\nBut the secret grew heavier each night, keeping him awake, making him snap at his little sister over nothing.\n\nFinally, he pulled it out and handed it to his mother, hands trembling. \"I'm sorry. I did badly and I was scared to show you.\"\n\nHis mother looked at it quietly, then at him. \"I'm not happy about the marks. But I'm much more worried that you were scared to tell me anything. Marks can improve. Trust between us matters more.\" 💛\n\nThey sat together that evening making a study plan, and for the first time in days, Ishaan slept peacefully.", "think": "🤔 *Think About It!*\nHave you ever hidden something because you were scared of someone's reaction? What made it hard, or easier, to finally share it?", "moral": "✨ *Today's Lesson:* Hiding a mistake makes it heavier — sharing it, even when scary, is how we start fixing it."}, {"id": 74, "category": "Drama", "title": "When Dad Lost His Job", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "💼 One evening, ten-year-old Maya overheard her parents talking quietly in the kitchen. \"The company let me go,\" Dad said, his voice tired. \"We'll need to be careful with money for a while.\"\n\nMaya felt scared — would they have to move? Would things change forever?\n\nThe next weeks were different — fewer outings, simpler meals — but Maya noticed something else too: Dad started picking her up from school every day, and they'd talk the whole walk home. 🚶‍♂️\n\n\"I miss the old ice cream trips,\" Maya admitted one day.\n\n\"Me too,\" Dad said, \"but I don't miss rushing past you every evening. I found a new job last week — but I'm going to keep walking you home anyway.\" 🍦\n\nMaya realized hard times had brought them something unexpected — more time together.", "think": "🤔 *Think About It!*\nHave you ever gone through a hard change at home? Was there anything unexpected — even small — that turned out okay, or good, during that time?", "moral": "✨ *Today's Lesson:* Hard times are still hard, but they can also reveal what truly matters most."}, {"id": 75, "category": "Drama", "title": "The Team That Didn't Pick Me", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "⚽ During gym class, team captains picked players one by one — and little Tariq was picked last, again. He walked to his spot on the field with his head down, cheeks burning. 😔\n\nAfter class, his friend Noah caught up with him. \"That felt unfair. You're actually really fast.\"\n\n\"Then why am I always picked last?\" Tariq asked bitterly.\n\n\"Because you don't shoot the ball much, so nobody's seen what you can do,\" Noah said honestly. \"Maybe show them next time instead of hanging back.\"\n\nThe next game, Tariq ran hard and finally took a shot — and scored! His teammates cheered, surprised.\n\nHe wasn't picked first the very next week either, but he was picked earlier. \"Change takes more than one game,\" he told himself, \"but it's starting.\" ⚽✨", "think": "🤔 *Think About It!*\nHave you ever felt overlooked or picked last for something? What is one small step you could take to show others what you're capable of?", "moral": "✨ *Today's Lesson:* Being overlooked doesn't mean staying overlooked — showing up and trying can slowly change things."}, {"id": 76, "category": "Drama", "title": "My Best Friend's New Best Friend", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "👭 Little Sana watched her best friend Ria laughing with a new girl at lunch, sitting in Sana's usual spot. A tight, jealous feeling squeezed her chest. 😞\n\nFor days, Sana felt pushed aside, but instead of saying anything, she just grew quieter and quieter around Ria.\n\nFinally, Ria noticed. \"Are you upset with me?\"\n\n\"You have a new best friend now,\" Sana blurted out, tears stinging.\n\nRia looked surprised. \"Priya is nice, but she's not replacing you. I didn't realize you felt left out — I should have invited you to sit with us.\"\n\nThe next day, all three girls sat together, and slowly, Sana realized having more friends didn't mean having less of Ria. 💕", "think": "🤔 *Think About It!*\nHave you ever felt jealous when a friend made another friend? What helped, or might help, you feel less worried about it?", "moral": "✨ *Today's Lesson:* Friendship isn't a limited pie — someone having another friend doesn't mean less love for you."}, {"id": 77, "category": "Drama", "title": "The Night the Power Went Out", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "🕯️ A huge storm knocked out the power across the whole neighborhood. No lights, no TV, no phone charging — nine-year-old Leo groaned, \"This is the WORST night ever.\"\n\nHis mother lit candles and pulled out an old deck of cards. \"Let's make the best of it.\"\n\nBy candlelight, the whole family played cards, told silly ghost stories, and Dad even brought out his old guitar, badly out of tune, singing songs from his own childhood. 🎸\n\nLeo laughed harder that night than he had in weeks.\n\nWhen the lights finally flickered back on near midnight, nobody rushed to turn on their screens right away. They just sat together a little longer, oddly reluctant for the ordinary night to end. ✨", "think": "🤔 *Think About It!*\nHave you ever had an unexpected inconvenience turn into a surprisingly fun memory? What made it special?", "moral": "✨ *Today's Lesson:* Sometimes losing what we're used to reveals a simpler kind of togetherness we'd forgotten."}, {"id": 78, "category": "Drama", "title": "Grandma Forgets My Name Now", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "👵 On their weekly visit, Grandma looked at ten-year-old Divya and asked, \"Now, whose lovely daughter are you?\" Divya's stomach dropped. \"Grandma, it's me — Divya!\"\n\nGrandma smiled kindly but confused. Mom pulled Divya aside gently. \"Grandma's memory is changing as she gets older. It's called dementia. It's not that she doesn't love you — her mind just has trouble holding onto things now.\"\n\nDivya felt sad and a little scared. The next visit, instead of expecting Grandma to remember, she brought old photo albums and pointed to pictures. \"This is us at the beach, Grandma. Remember the shells we collected?\"\n\nGrandma's eyes lit up. \"Oh, yes! Such a happy day.\" She might not remember Divya's name every time, but together, they still made new happy moments. 💛", "think": "🤔 *Think About It!*\nHas someone you loved changed in a way that was hard to understand? What helped you feel connected to them anyway?", "moral": "✨ *Today's Lesson:* Love can find new ways to connect, even when memory or circumstances change."}, {"id": 79, "category": "Drama", "title": "The Apology I Almost Didn't Give", "age": "Ages 8–10 📚", "tradition": "Drama 🎭", "text": "😤 During a group project, ten-year-old Karan snapped angrily at his partner Wei, blaming him for a mistake that was actually Karan's own fault. Wei looked hurt and stayed quiet the rest of class.\n\nKaran knew he should apologize, but his pride kept whispering, \"Just let it go, it's not a big deal.\"\n\nThat night, Karan couldn't stop thinking about Wei's hurt expression. The next morning, hands sweaty, he walked up to Wei before class. \"I was wrong yesterday. It was my mistake, not yours, and I shouldn't have snapped at you. I'm sorry.\"\n\nWei's face relaxed into a small smile. \"Thanks for saying that. It actually means a lot.\"\n\nKaran felt lighter than he had all night — that one hard sentence had been worth more than his pride. 🤝", "think": "🤔 *Think About It!*\nHas your pride ever made it hard to say sorry, even when you knew you should? What finally helped you say it?", "moral": "✨ *Today's Lesson:* Swallowing pride to give an honest apology is hard, but it almost always feels better than staying silent."}, {"id": 80, "category": "Fun", "title": "The Burping Contest Bandicoot", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "🐹 Bindi the bandicoot could burp louder than anyone in the whole forest. BUUURRRP! 😂\n\n\"That's disgusting,\" said the prim rabbit, wrinkling her nose.\n\nBut when the forest held its Silly Sounds Festival, Bindi's thunderous burp won FIRST PRIZE, echoing across the whole valley! 🏆\n\nEven the rabbit couldn't stop giggling. \"Okay, that WAS impressive,\" she admitted, snorting with laughter.\n\nBindi grinned proudly. \"Being a LITTLE bit silly is basically my superpower!\" she cheered, letting out one more enormous BUUURRRP for good measure. 🎉", "think": "🤔 *Think About It!*\nWhat's the silliest sound YOU can make? Can you try it right now and see who laughs?", "moral": "✨ *Today's Lesson:* Being a little silly sometimes is just as wonderful as being serious."}, {"id": 81, "category": "Fun", "title": "Grandpa's Dancing Slippers", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "🩰 Grandpa's old fuzzy slippers had a secret — whoever wore them couldn't stop dancing! 💃\n\nLittle Priya slipped them on to fetch her ball, and suddenly — wiggle wiggle, twirl twirl! She couldn't stop no matter how hard she tried, giggling the whole time. 😂\n\nMama walked in and slipped on the OTHER slipper by accident. Now they were BOTH dancing around the living room, bumping into the sofa, laughing so hard they could barely breathe. 🛋️\n\nEven the family dog started spinning in silly circles, barking along.\n\nWhen they finally kicked off the slippers, breathless, Priya giggled, \"Best. Chore. Ever.\" 🐕✨", "think": "🤔 *Think About It!*\nIf your shoes made you dance every time you wore them, what silly place would you want to dance in?", "moral": "✨ *Today's Lesson:* A little unexpected silliness can turn an ordinary moment into a happy memory."}, {"id": 82, "category": "Fun", "title": "The Day My Dog Wore My Pants", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "🐶 Little Zoya left her pants on the floor while getting ready, and her puppy Biscuit decided they looked VERY comfortable. 😆\n\nSomehow, Biscuit wiggled his back legs right into them and trotted around the house wearing Zoya's pants like the fanciest dog in town! 👖\n\n\"Biscuit! Those are MY pants!\" Zoya laughed so hard she fell onto the couch.\n\nBiscuit paraded proudly through the living room, tripping over the extra-long legs, tail wagging with pride the whole time.\n\nMama snapped a photo before gently helping Biscuit out of the tangle. \"Best dressed dog in the whole neighborhood,\" she declared, still giggling. 📸", "think": "🤔 *Think About It!*\nHas your pet, or a stuffed animal, ever done something silly that made you laugh out loud?", "moral": "✨ *Today's Lesson:* The silliest, most unplanned moments often become our favorite memories to laugh about later."}, {"id": 83, "category": "Fun", "title": "Soup Made of Giggles", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "🍲 Chef Pablo the penguin claimed he had invented the world's silliest recipe: Giggle Soup. \"One cup of jokes, two tickles, and a splash of funny faces!\" he announced. 🐧\n\nHe stirred the pretend pot dramatically, then made the silliest face imaginable at his customers — tongue out, eyes crossed! 🤪\n\nEveryone at the table burst out laughing — HA HA HA!\n\n\"See?\" Pablo grinned. \"Giggle Soup works every time!\"\n\nHe served invisible bowls to everyone, and the whole restaurant kept right on giggling, long after the imaginary soup was finished. 😂🥄", "think": "🤔 *Think About It!*\nIf YOU made a silly soup out of things that make you laugh, what ingredients would you put in it?", "moral": "✨ *Today's Lesson:* Laughter is contagious — sharing it is one of the easiest gifts to give."}, {"id": 84, "category": "Fun", "title": "The Sneezing Elephant Parade", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "🐘 Ellie the elephant had the ITCHIEST nose from all the dusty flowers in the jungle. \"Ah... ah... AHCHOOO!\" 🌼\n\nHer sneeze was SO powerful it blew all the leaves off three trees and knocked a monkey clean off his branch! 🙉\n\n\"Bless you!\" shouted every animal at once, then burst into giggles at the huge mess of leaves everywhere.\n\nEllie sneezed again — ACHOO! — and this time blew a whole line of ducks straight into the river, quacking indignantly. 🦆\n\nBy the end of the day, the whole jungle had joined a silly parade, marching behind Ellie and her mighty, mighty sneezes. 🎉", "think": "🤔 *Think About It!*\nWhat is the biggest sneeze YOU have ever done? Did anyone laugh?", "moral": "✨ *Today's Lesson:* Even the messiest accidents can turn into the funniest shared moments."}, {"id": 85, "category": "Fun", "title": "My Pet Rock Runs Away", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "🪨 Little Theo loved his pet rock, Pebbles, and carried him everywhere in a little box. One windy day at the park, a huge gust — WHOOSH! — knocked Pebbles right out of the box and rolling down the hill! 💨\n\n\"Pebbles is running away!\" Theo shouted dramatically, chasing after him, giggling the whole time.\n\nPebbles rolled under a bench, bounced off a bush, and finally stopped near a duck pond, looking (as always) exactly the same.\n\nTheo scooped him up triumphantly. \"You had quite the adventure today, Pebbles!\"\n\nThat night, he told his whole family the epic tale of Pebbles' Great Escape, adding more excitement with every retelling. 😄🪨", "think": "🤔 *Think About It!*\nDo you have a favorite toy that goes on 'adventures' with you? What silly story could you make up about it?", "moral": "✨ *Today's Lesson:* Imagination can turn even a rock into the hero of the silliest, most fun stories."}, {"id": 86, "category": "Fun", "title": "The Upside-Down Umbrella Day", "age": "Ages 2–4 🧸", "tradition": "Fun 🎈", "text": "☂️ On a windy, rainy day, little Maya's umbrella suddenly flipped completely inside out — WHOOSH! 💨\n\n\"It looks like a funny flower now!\" she laughed, holding it up proudly.\n\nInstead of fixing it right away, she skipped through puddles holding her funny flower-umbrella, rain splashing everywhere. 💦\n\nHer big brother saw her and flipped HIS umbrella inside out too, and soon a whole group of kids were splashing around with their silly flower umbrellas held high. 🌸\n\n\"Best rainy day EVER,\" Maya giggled, twirling in the puddles.", "think": "🤔 *Think About It!*\nHas something ever gone 'wrong' — like your umbrella flipping — that turned into something fun instead?", "moral": "✨ *Today's Lesson:* When plans go a little sideways, sometimes that's exactly when the fun begins."}, {"id": 87, "category": "Fun", "title": "The Homework That Ate Itself", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "📝 Little Jenny left her math homework on the kitchen table, right next to a plate of chocolate cake. When she came back — her worksheet had chocolate handprints ALL over it! 🍫\n\n\"My baby brother ATE my homework!\" she gasped, staring at little Ravi, chocolate smeared cheek to cheek, grinning innocently.\n\nShe tried to explain to her teacher the next day. \"My homework got... eaten. Sort of.\"\n\nHer teacher raised an eyebrow, unconvinced, until Jenny showed a photo of Ravi's chocolatey masterpiece.\n\nThe whole class burst out laughing, and her teacher, still chuckling, gave her one extra day. \"Best excuse I've heard all year,\" she admitted. 😂🍰", "think": "🤔 *Think About It!*\nWhat's the funniest excuse or mix-up that's ever happened with your homework or chores?", "moral": "✨ *Today's Lesson:* Even the most annoying accidents can turn into the best stories to tell later."}, {"id": 88, "category": "Fun", "title": "Pajama Day at School", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "🛌 Half-asleep, little Arun rushed to catch the school bus — and didn't realize until he sat down in class that he'd forgotten to change out of his dinosaur pajamas! 🦖\n\n\"Arun, why are you in your PJs?\" his friend whispered, giggling.\n\nArun looked down, horrified — then noticed his teacher's kind smile. \"Well,\" she announced to the class, \"today is officially Pajama Day, everyone! Arun gets to pick tomorrow's fun theme too!\"\n\nThe whole class cheered. By lunchtime, three other kids had \"accidentally\" worn their pajamas too, giggling in solidarity. 😄\n\nArun, once mortified, walked home that day feeling like the most popular kid in school.", "think": "🤔 *Think About It!*\nHas an embarrassing mistake ever turned into something everyone ended up enjoying together?", "moral": "✨ *Today's Lesson:* An embarrassing moment can turn into a fun memory if you let yourself laugh along with everyone else."}, {"id": 89, "category": "Fun", "title": "The Great Broccoli Rebellion", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "🥦 At dinner, little Zara declared, \"Broccoli should NOT be allowed at this table!\" and staged a dramatic protest, holding up a sign made of napkins: \"NO MORE TREES ON MY PLATE!\" 🪧\n\nHer little brother joined the protest, marching around the kitchen chanting, \"No more trees! No more trees!\"\n\nDad, trying not to laugh, negotiated: \"What if the broccoli trees get a cheese blanket?\" He sprinkled melted cheese on top. 🧀\n\nZara eyed it suspiciously, took one tiny bite... then another. \"Okay,\" she admitted, \"cheese-blanket broccoli trees are ALLOWED at this table.\"\n\nThe Great Broccoli Rebellion ended peacefully, with full bellies and a lot of giggles. 😄", "think": "🤔 *Think About It!*\nIs there a food you don't love that might taste better with a silly new name or a fun twist?", "moral": "✨ *Today's Lesson:* A little creativity and humor can turn a stubborn 'no' into a happy 'yes.'"}, {"id": 90, "category": "Fun", "title": "Mr. Wobble's Wonky Bicycle", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "🚲 Old Mr. Wobble's bicycle had one wheel slightly smaller than the other, so he wobbled up and DOWN the whole street every single ride. 😆\n\nKids would gather just to watch him pass — bob, bob, bob — waving cheerfully with every up-and-down bump.\n\n\"Why don't you fix it, Mr. Wobble?\" a boy named Tomi asked one day.\n\nMr. Wobble laughed heartily. \"And lose my famous wobble? This bike has made more kids smile than a perfectly straight one ever could!\"\n\nHe wobbled off down the road, whistling, waving at every giggling child along the way, proud of his silly, imperfect ride. 🎶", "think": "🤔 *Think About It!*\nIs there something a little imperfect about you or your things that actually makes people smile or makes you unique?", "moral": "✨ *Today's Lesson:* Things that aren't perfect can still bring more joy than perfect ones do."}, {"id": 91, "category": "Fun", "title": "The Burp That Traveled the World", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "🌍 During a video call with cousins in three different countries, little Aarav let out the LOUDEST burp anyone had ever heard. \"BURRRRP!\" 😂\n\nThe screen froze for a second, then all three cousins burst out laughing at exactly the same moment, their laughter echoing across time zones.\n\n\"That burp just traveled around the ENTIRE world in one second!\" his cousin in London giggled.\n\nFor weeks after, the family group chat was filled with burp emoji jokes and remember-when messages. 📱😂\n\nAarav became legendary in his family for \"The Burp Heard Round the World,\" and he couldn't have been prouder.", "think": "🤔 *Think About It!*\nWhat's a funny family moment that everyone still laughs about and retells, even much later?", "moral": "✨ *Today's Lesson:* Silly shared moments become the inside jokes that bring families closer, even across long distances."}, {"id": 92, "category": "Fun", "title": "My Little Sister the Superhero", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "🦸 Little Rhea tied a bath towel around her neck like a cape and declared herself \"Captain Sparklefist,\" ready to save the neighborhood from BOREDOM. ✨\n\nShe ran through the house, \"flying\" with arms out, rescuing her teddy bear from the \"evil couch monster\" and delivering \"justice\" to her brother's messy room. 🧸\n\n\"Captain Sparklefist, the couch is NOT actually a monster,\" her brother laughed, trying to sound serious.\n\n\"Every hero needs a villain!\" Rhea declared dramatically, striking a heroic pose on the ottoman.\n\nBy bedtime, the whole family had joined her imaginary adventure, laughing more than they had all week. 😄🦸‍♀️", "think": "🤔 *Think About It!*\nIf YOU were a superhero for a day, what silly, fun name would you give yourself, and what would your superpower be?", "moral": "✨ *Today's Lesson:* Imagination can turn an ordinary afternoon into an exciting, joyful adventure."}, {"id": 93, "category": "Fun", "title": "The Sneaky Sock Thief", "age": "Ages 5–7 🚀", "tradition": "Fun 🎈", "text": "🧦 Every week, one single sock would mysteriously vanish from the laundry, leaving lonely, matchless socks behind. \"Where do they GO?\" little Kian wondered.\n\nHe decided to become a detective, setting up a flashlight and a notebook to \"investigate\" the washing machine at midnight. 🔦\n\nThe next morning, he found the culprit: the family dog, Biscuit, had a secret pile of stolen socks hidden behind the sofa, like sleepy trophies! 🐶\n\n\"Case closed!\" Kian announced proudly, holding up seven mismatched socks.\n\nThe family laughed for days about Biscuit, the sneakiest sock thief in town, and started calling the missing sock pile \"Biscuit's treasure chest.\" 😂", "think": "🤔 *Think About It!*\nHas something in your house ever mysteriously gone missing? Who or what do you think the sneaky culprit might be?", "moral": "✨ *Today's Lesson:* Everyday little mysteries can be a fun adventure if you look at them with curiosity instead of frustration."}, {"id": 94, "category": "Fun", "title": "The Invention That Folded Laundry Backwards", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🤖 For the school science fair, ten-year-old Kavya built a laundry-folding machine out of cardboard, string, and an old fan. \"It'll fold clothes perfectly!\" she announced confidently.\n\nShe switched it on — and instead of folding, it flung socks across the gym, sent a shirt flying onto the judge's head, and somehow tied a pair of shorts into a knot shaped like a pretzel! 🥨\n\nThe whole gym erupted into laughter, including the judges.\n\nKavya's face turned red — until she noticed everyone was laughing WITH her, not at her, delighted by the chaos.\n\nShe didn't win first prize, but she won the \"Most Entertaining Invention\" award, and spent the rest of the day performing \"the pretzel trick\" on request. 🏆😂", "think": "🤔 *Think About It!*\nHave you ever tried to build or make something that didn't go as planned but turned out funny or interesting anyway?", "moral": "✨ *Today's Lesson:* Not every project has to go perfectly to be worth trying — sometimes the mess is the best part."}, {"id": 95, "category": "Fun", "title": "The Day the Principal Wore a Dinosaur Costume", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🦕 Principal Mrs. Fernandes promised that if the whole school read 500 books together for the reading challenge, she'd wear a dinosaur costume for an entire day.\n\nNobody believed she'd actually do it — until the school reached 500 books, and the very next Monday, a giant green T-Rex walked into morning assembly, waving with its tiny arms. 😂\n\n\"RRRAWR!\" Mrs. Fernandes roared into the microphone, tripping slightly over her tail. The entire school screamed with laughter.\n\nShe taught math in the costume, ate lunch in the costume, and even tried (unsuccessfully) to open a door with her tiny dinosaur arms. 🚪\n\n\"Best. Reading. Challenge. EVER,\" every student agreed, already planning next year's goal.", "think": "🤔 *Think About It!*\nWhat silly challenge or reward could motivate you and your friends or family to work toward a big goal together?", "moral": "✨ *Today's Lesson:* A shared goal feels more fun and worth the effort when there's a joyful reward waiting at the end."}, {"id": 96, "category": "Fun", "title": "The Great Cafeteria Food Fight (That Wasn't)", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🍕 A tray tipped over in the school cafeteria, and someone shouted \"FOOD FIGHT!\" — but instead of chaos, one clever teacher clapped her hands. \"FREEZE! Whoever moves first loses dessert privileges for a week!\" 🥶\n\nTwo hundred kids froze mid-motion, some holding food halfway to their mouths, others mid-laugh, one boy stuck balancing on one foot. 😂\n\nThe frozen cafeteria looked like the world's funniest photograph — pizza slices hovering, juice boxes tilted, everyone's face stuck in a ridiculous expression.\n\nAfter a full, hilarious minute, the teacher finally said, \"Unfreeze — and clean up together!\"\n\nEveryone burst out laughing and cleaned the mess side by side, and the \"food fight that wasn't\" became the most legendary lunch of the whole year. 🧹😄", "think": "🤔 *Think About It!*\nCan you think of a clever, funny solution that stopped a problem from getting worse — like the teacher's \"freeze\" game?", "moral": "✨ *Today's Lesson:* A little creativity and humor can turn a potential mess into a moment everyone remembers fondly."}, {"id": 97, "category": "Fun", "title": "My Homework Turned Into a Talent Show", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🎤 Ten-year-old Neel was supposed to write a boring essay about \"My Summer Vacation,\" but instead, he turned it into a rap, complete with beatboxing sound effects written in the margins. 🎶\n\nHis teacher, expecting a plain essay, read it silently first — then burst out laughing and asked Neel to perform it out loud for the class.\n\nNeel stood up nervously, then rapped his entire summer vacation story, complete with dramatic pauses and hand gestures. The class cheered and clapped along! 👏\n\n\"This wasn't exactly the assignment,\" his teacher laughed, \"but it might be the most memorable essay I've ever received.\"\n\nShe gave him full marks — and asked if he'd perform it again at the school's talent show. 🏆", "think": "🤔 *Think About It!*\nIs there a boring task you could make more fun by doing it in a creative or silly way, like turning it into a song or a game?", "moral": "✨ *Today's Lesson:* Even ordinary assignments can become fun and memorable with a little creativity."}, {"id": 98, "category": "Fun", "title": "The Class Pet Who Ran for Mayor", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🐹 As a joke during the school's mock election unit, ten-year-old Farida nominated the class hamster, Sir Nibbles, for \"Mayor of the Classroom.\" 🏛️\n\n\"Vote Nibbles — he never breaks promises, because he never makes any!\" her campaign poster read, complete with a tiny hamster wearing a paper crown.\n\nTo everyone's shock, Sir Nibbles WON, beating out two very serious human candidates with actual speeches.\n\n\"How did a hamster win a class election?\" the teacher laughed, reviewing the votes.\n\n\"Because everyone agreed he'd never raise homework taxes,\" Farida said solemnly, and the whole class dissolved into giggles.\n\nSir Nibbles \"governed\" for a week, mostly by running on his wheel, and the whole school still talks about the Great Hamster Election. 🎉", "think": "🤔 *Think About It!*\nWhat silly campaign promises would YOU make if you were running for class president — or if your pet was?", "moral": "✨ *Today's Lesson:* Learning through play and humor can make even a serious topic, like elections, fun to understand."}, {"id": 99, "category": "Fun", "title": "The Smelliest Science Fair Project", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🧪 For the science fair, ten-year-old Omar decided to grow the \"World's Smelliest Cheese Mold\" as an experiment on bacteria growth. \"For SCIENCE!\" he declared proudly.\n\nBy the third week, his project jar smelled so powerfully bad that three separate teachers asked him to move it to the hallway. 🤢\n\nOn presentation day, judges approached his table, took one whiff, and visibly recoiled, eyes watering. \"This is... certainly memorable,\" one judge coughed.\n\nDespite — or maybe because of — the smell, Omar's detailed charts on mold growth impressed the judges, and he won \"Most Unforgettable Experiment.\" 🏆\n\nHe proudly kept the ribbon, but agreed the jar could finally, MERCIFULLY, go in the trash. 😂🗑️", "think": "🤔 *Think About It!*\nWhat's the messiest or silliest experiment or project you'd love to try, even if it might go a little wrong?", "moral": "✨ *Today's Lesson:* Real science is sometimes messy and stinky — and that's often when the most memorable learning happens."}, {"id": 100, "category": "Fun", "title": "The Time My Family Got Lost Using a GPS That Only Spoke in Riddles", "age": "Ages 8–10 📚", "tradition": "Fun 🎈", "text": "🚗 On a road trip, the family's old GPS app glitched and started giving directions only in riddles. \"Turn where the sun forgets to shine, and greet the road that has no name,\" it announced solemnly. 🧩\n\n\"What does THAT mean?!\" Dad groaned, squinting at three identical-looking turns.\n\nTen-year-old Priya, delighted, grabbed a notebook. \"I'll be the riddle translator!\" She decoded each clue with wild guesses, sending them down one wrong road, then a dead end, then — finally — the right way, purely by luck. 🗺️\n\nWhat should have been a twenty-minute drive took two hilarious hours, filled with wrong turns, snack breaks, and Priya's increasingly dramatic riddle theories.\n\nWhen they finally arrived, Mom laughed, \"Best. Wrong. Turns. Ever.\" They kept the glitchy GPS app just for fun after that. 😂", "think": "🤔 *Think About It!*\nHas getting lost or taking a 'wrong turn' ever turned into an unexpectedly fun memory for you or your family?", "moral": "✨ *Today's Lesson:* Not every unplanned detour is a disaster — sometimes getting lost together is the best part of the trip."}];

const CATS = ["Religion", "Science", "Fiction", "Drama", "Fun"];
const AGES = ["2–4", "5–7", "8–10"];
const CAT_EMOJI = { Religion: "🕉️", Science: "🔬", Fiction: "📖", Drama: "🎭", Fun: "🎈" };

let activeCat = null;
let activeAge = null;
let searchTerm = "";

function ageBand(ageStr) {
  return AGES.find(a => ageStr.includes(a)) || "";
}

function buildFilters() {
  const ageWrap = document.getElementById("ageFilters");
  AGES.forEach(a => {
    const p = document.createElement("div");
    p.className = "pill";
    p.textContent = "Ages " + a;
    p.dataset.age = a;
    p.onclick = () => { activeAge = activeAge === a ? null : a; render(); };
    ageWrap.appendChild(p);
  });

  const catWrap = document.getElementById("catFilters");
  CATS.forEach(c => {
    const p = document.createElement("div");
    p.className = "pill";
    p.dataset.cat = c;
    p.textContent = CAT_EMOJI[c] + " " + c;
    p.onclick = () => { activeCat = activeCat === c ? null : c; render(); };
    catWrap.appendChild(p);
  });
}

function matches(story) {
  if (activeCat && story.category !== activeCat) return false;
  if (activeAge && ageBand(story.age) !== activeAge) return false;
  if (searchTerm) {
    const hay = (story.title + " " + story.text).toLowerCase();
    if (!hay.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function excerpt(text) {
  const clean = text.replace(/[\n]/g, " ").replace(/\s+/g, " ").trim();
  return clean.length > 110 ? clean.slice(0, 110) + "…" : clean;
}

function render() {
  document.querySelectorAll(".pill[data-cat]").forEach(p => {
    p.classList.toggle("active", p.dataset.cat === activeCat);
  });
  document.querySelectorAll(".pill[data-age]").forEach(p => {
    p.classList.toggle("active", p.dataset.age === activeAge);
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const filtered = STORIES.filter(matches);
  document.getElementById("emptyState").style.display = filtered.length ? "none" : "block";

  filtered.forEach(story => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.cat = story.category;
    card.onclick = () => openModal(story);
    card.innerHTML = `
      <div class="tags">
        <span class="badge">${CAT_EMOJI[story.category]} ${story.category}</span>
        <span class="badge">${story.age}</span>
      </div>
      <h3>${story.title}</h3>
      <div class="excerpt">${excerpt(story.text)}</div>
    `;
    grid.appendChild(card);
  });
}

function whatsappText(story) {
  return `📖 *${story.title}*\n🏷️ ${story.tradition}  |  ${story.age}\n\n${story.text}\n\n${story.think}\n\n${story.moral}`;
}

function openModal(story) {
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="tags">
      <span class="badge">${CAT_EMOJI[story.category]} ${story.category}</span>
      <span class="badge">${story.age}</span>
    </div>
    <h2>${story.title}</h2>
    <div class="body-text">${story.text}</div>
    <div class="think">${story.think}</div>
    <div class="moral">${story.moral}</div>
    <button class="copy-btn" id="copyBtn">📋 Copy for WhatsApp</button>
  `;
  document.getElementById("copyBtn").onclick = (e) => {
    navigator.clipboard.writeText(whatsappText(story)).then(() => {
      e.target.textContent = "✅ Copied!";
      e.target.classList.add("copied");
      setTimeout(() => { e.target.textContent = "📋 Copy for WhatsApp"; e.target.classList.remove("copied"); }, 1500);
    });
  };
  document.getElementById("overlay").classList.add("open");
}
function closeModal() {
  document.getElementById("overlay").classList.remove("open");
}
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeModal();
});

document.getElementById("searchBox").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  render();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  const pool = STORIES.filter(matches);
  const list = pool.length ? pool : STORIES;
  const pick = list[Math.floor(Math.random() * list.length)];
  openModal(pick);
});

// Show which story is "next" based on the tracker cycle (best-effort local guess: day-of-year based)
function computeNextStory() {
  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  const idx = dayOfYear % STORIES.length;
  return STORIES[idx];
}
document.getElementById("statTotal").textContent = STORIES.length;
const nextGuess = computeNextStory();
document.getElementById("statNext").textContent = nextGuess.title;
document.getElementById("statNext").parentElement.title = "Actual delivery order is tracked by story_tracker.json — this is only an estimate.";
document.getElementById("statNext").parentElement.onclick = () => openModal(nextGuess);
document.getElementById("statNext").parentElement.style.cursor = "pointer";

buildFilters();
render();
</script>
</body>
</html>
